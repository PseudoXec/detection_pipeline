# Vehicle mode: vehicle detect → crop → plate detect → crop → send metadata.
# Everything here is used by vehicle mode only.
# Relative paths are relative to this folder (modes/vehicle/). Machine-specific overrides: config.local.yaml.

model:
  vehicle_weights: "models/vehicle.onnx"
  plate_weights: "models/platenum_closeup.onnx"
  vehicle_imgsz: [512, 896] # [height, width] - must match vehicle.onnx's static shape
  plate_imgsz: 640 # must match platenum_closeup.onnx's static shape
  vehicle_conf_threshold: 0.50
  plate_conf_threshold: 0.50
  vehicle_classes: null # e.g. "car,truck,bus,motorcycle"; null = accept all
  agnostic_nms: true # one box per vehicle even when the model flips between classes

roi: # what counts as inside the zone (the polygon itself is in camera/config.yaml)
  crop_margin: 0.05

