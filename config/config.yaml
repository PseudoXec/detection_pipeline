camera:
  source_mode: "static" # "static" | "api"
  rtsp_url: "rtsp://admin:Victoria2313*@192.168.100.229:554/stream1"
  frame_width: 1280
  frame_height: 720
  capture_buffer_size: 1
  decode_threads: 2
  max_fps: 10
  reconnect_delay_seconds: 5.0
  max_reconnect_attempts: 0 # 0 = retry forever
  isapi_enabled: true
  isapi_port: 80
  isapi_https: false
  isapi_channel_id: 1 # channel whose name is used as the camera name
  # isapi_username / isapi_password: only needed if different from rtsp_url's own login

roi:
  polygon:
    - [0.20, 0.20]
    - [0.80, 0.20]
    - [0.80, 0.80]
    - [0.20, 0.80]
  crop_margin: 0.05

model:
  vehicle_weights: "models/vehicle.onnx"
  plate_weights: "models/platenum_closeup.onnx"
  device: null # null = auto
  inference_threads: 2 # 0 = auto, -1 = no limit
  vehicle_imgsz: [512, 896] # [height, width] - must match vehicle.onnx's static shape
  plate_imgsz: 640 # must match platenum_closeup.onnx's static shape
  vehicle_conf_threshold: 0.35
  plate_conf_threshold: 0.35
  vehicle_classes: null # e.g. "car,truck,bus,motorcycle"; null = accept all
  agnostic_nms: true # one box per vehicle even when the model flips between classes

tracking:
  dedup_cooldown_seconds: 2.0
  detector_conf_floor: 0.10 # lets ByteTrack keep tracks alive; boxes under vehicle_conf_threshold are still dropped, 0 = off
  plate_dedup_seconds: 30 # the same plate text is saved once per this window, 0 = off
  max_plate_attempts: 4
  plate_retry_interval_seconds: 0.4
  plate_stale_finalize_seconds: 1.5
  track_ttl_seconds: 30

crop:
  plate_min_crop_height: 160
  plate_padding_pixels: 4
  plate_padding_ratio: 0.12

preprocess:
  plate_crop_min_height: 64

ocr:
  fast_plate_ocr_model: "cct-xs-v2-global-model"
  cpu_threads: 1
  min_confidence: 0.5
  plate_formats: ["LLLDDDD"] # L = letter, D = digit: ABC 1234. Add "LLLDDD" for older plates, "DDDLLL" for some motorcycles
  plate_format_strict: true # true = reads that fit no format become Unrecognized
  plate_separator: " " # placed between letter and digit groups, "" for none
  unrecognized_text: "Unrecognized"
  accept_score: 0.75
  early_exit_score: 0.85
  worker_threads: 1
  finalize_queue_size: 32

storage:
  database_path: "data/pipeline_buffer.db"
  output_dir: "output"
  jpeg_quality: 90
  plate_jpeg_quality: 96
  retention_days: 14
  max_unsynced_days: 0
  delete_disk_images_after_send: true
  send_retry_seconds: 60

runtime:
  log_level: "INFO"
  opencv_threads: 2
  max_frames: 0 # 0 = run forever

features:
  roi_filter: true
  roi_crop_detect: true
  fallback_tracker: true
  position_dedup: true
  plate_detection: true
  enhance_before_plate_detect: true
  enhance_plate_crop: true
  ocr_read: true
  async_ocr: true
  save_images_to_disk: true
  show_preview: false
  live_stream: true
  live_boxes: false

  time_vehicle_detect: true
  time_vehicle_crop: true
  time_plate_detect: true
  time_plate_crop: true

  print_console: true
  print_timing: true

  store_to_sqlite: true

  send_via_api: true
  delete_row_after_api_send: true

  col_vehicle_image: true
  col_vehicle_box: true
  col_plate_image: true
  col_plate_box: true
  col_vehicle_detect_ms: true
  col_vehicle_crop_ms: true
  col_plate_detect_ms: true
  col_plate_crop_ms: true
  col_total_pipeline_ms: true
  col_ocr_read: true

api:
  enabled: true # master switch: off = no ROI fetch, no camera source fetch, no data sending
  endpoint_url: "http://192.168.100.14:5086/api/AiDetection/PlateDetected"
  timeout_seconds: 5.0
  roi_endpoint_url: "http://192.168.100.14:5086/api/AiDetection/roi-coordinates"
  camera_id: 4
  roi_fetch_timeout_seconds: 3.0
  roi_poll_interval_seconds: 30.0
  roi_coordinates_are_pixels: false
  roi_reference_width: 1920
  roi_reference_height: 1080

live:
  camera_id: "cam1"
  serve_host: "0.0.0.0"
  serve_port: 8090
  stream_fps: 10
  stream_width: 960
  jpeg_quality: 70
  box_max_age_seconds: 3
  auth_token: null

  # push mode (features.live_boxes)
  endpoint_url: null
  max_hz: 10
  timeout_seconds: 1.0
